<script>
/* ===== Supabase ===== */
const SUPA_URL='https://ucvqfmhpakhqktarkphr.supabase.co';
const SUPA_KEY='sb_publishable_TG-pGp2iue1WiMNBYABlvw_WRtjqwUS';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const mtEmail=u=>String(u).trim().toLowerCase()+'@gmail.com';
let mtSyncing=0,mtSig='',mtProfSig='';
const mtDate=s=>{const n=new Date(s);return n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()};
const mtStatus=s=>({approved:'success',completed:'success',success:'success',rejected:'cancel',cancelled:'cancel',canceled:'cancel',cancel:'cancel',failed:'cancel'}[String(s).toLowerCase()]||'pending');
async function loadUserData(silent){
  if(!S.uid)return;
  try{
    const [w,u,t]=await Promise.all([
      sb.from('wallets').select('balance').eq('user_id',S.uid).maybeSingle(),
      sb.from('mtusers').select('name,mob,email').eq('id',S.uid).maybeSingle(),
      sb.from('transactions').select('*').eq('user_id',S.uid).order('created_at',{ascending:false})
    ]);
    const rows=t.data||[];
    const reserved=rows.filter(x=>x.type!=='add'&&mtStatus(x.status)==='pending').reduce((a,x)=>a+(+x.amount||0),0);
    const bal=Math.max(0,(w.data?+w.data.balance:0)-reserved);
    const tx=rows.map(x=>({id:x.id,db:1,s:mtStatus(x.status),in:x.type==='add'?1:0,f:x.type==='add'?'💰':x.type==='withdraw'?'🏧':'💸',cur:'BDT',amt:+x.amount,bdt:+x.amount,name:x.type==='add'?'Add Money':x.type==='withdraw'?'Withdraw':'Send Money',num:x.trx_id||'-',d:mtDate(x.created_at)}));
    let name=S.name,pr=S.pr;
    if(u.data){name=u.data.name||name;pr=Object.assign({},S.pr||{},{mob:u.data.mob||(S.pr&&S.pr.mob)||'',email:u.data.email||(S.pr&&S.pr.email)||''})}
    const sig=JSON.stringify([bal,name,tx.map(x=>[x.id,x.s])]);
    if(silent&&sig===mtSig)return;
    mtSig=sig;S.bal=bal;S.name=name;S.pr=pr;S.tx=tx;
    render();
  }catch(e){console.error('loadUserData',e)}
}
async function syncTx(x){
  if(!S.uid||x.db)return;x.db=1;
  if(/^(Bonus|Promo)/.test(x.name||''))return;
  mtSyncing++;
  try{
    const type=x.in?'add':/^Withdraw/.test(x.name||'')?'withdraw':'send';
    const {error}=await sb.from('transactions').insert({id:x.id,user_id:S.uid,type,amount:x.bdt,status:'pending',trx_id:(x.num&&x.num!=='-')?String(x.num):'MT-'+Math.floor(Math.random()*1e6)});
    if(error){x.db=0;console.error('syncTx',error)}
  }catch(e){x.db=0;console.error('syncTx',e)}
  mtSyncing--;
  if(!mtSyncing)loadUserData();
}
async function saveProfile(){
  if(!S.uid)return;
  const rec={id:S.uid,name:S.name||'User',mob:(S.pr&&S.pr.mob)||'',email:(S.pr&&S.pr.email)||''};
  const sig=JSON.stringify(rec);if(sig===mtProfSig)return;mtProfSig=sig;
  try{await sb.from('mtusers').upsert(rec)}catch(e){mtProfSig=''}
}
setInterval(()=>{if(S.uid&&!mtSyncing&&!document.hidden)loadUserData(true)},10000);
</script>

 const show=k=>{cur=((k%n)+n)%n;mark();place()};
 slApi=show;
 tr.classList.add('drag');place();requestAnimationFrame(()=>requestAnimationFrame(()=>tr.classList.remove('drag')));
 const play=()=>{clearInterval(slT);if(S.slPaused||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  slT=setInterval(()=>{if(!el.isConnected){clearInterval(slT);return}if(S.sheet)return;show(cur+1)},4500)};
 let x0=null,dx=0,t0=0;
 tr.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;t0=Date.now();slMoved=false;clearInterval(slT);tr.classList.add('drag')});
 tr.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)slMoved=true;
  const edge=(cur===0&&dx>0)||(cur===n-1&&dx<0);place(edge?dx*.3:dx)});
 const end=()=>{if(x0===null)return;tr.classList.remove('drag');const v=dx/((Date.now()-t0)||1),th=step()*.18;x0=null;
  if((dx<-th||v<-.5)&&cur<n-1)show(cur+1);else if((dx>th||v>.5)&&cur>0)show(cur-1);else place();
  setTimeout(()=>{slMoved=false},60);play()};
 tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',end);tr.addEventListener('pointerleave',end);
 el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1)});
 play()}
let balT;
function armBal(){clearTimeout(balT);S.balAt=Date.now();balT=setTimeout(()=>{if(S.showBal){S.showBal=false;S.balAnim=true;render()}},(S.balSec||5)*1000)}
let shownRate=0;
const fr=v=>rn((Math.round(v*10)/10).toFixed(1));
function countNum(el,a,b,ms,f){if(!el)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=f(b);return}
 const t0=performance.now();(function step(n){const p=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-p,4);el.textContent=f(a+(b-a)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)})(t0)}
function midHTML(r){return `<div class="rflag">${r.f}</div><div class="rtxt"><small>${t('today')}</small><b>${r.f} ${cname(r)} = ৳<span id="ratenum">${fr(r.r)}</span></b></div>`}
function dotsHTML(){return RATES.slice(0,MAINN).map((_,i)=>`<i class="${i===S.rate?'on':''}"></i>`).join('')}
function paintRate(){
 const el=$('#rate');if(!el)return;
 const mid=el.querySelector('.rmid'),from=RATES[shownRate],to=RATES[S.rate];shownRate=S.rate;
 el.querySelector('.dots').innerHTML=dotsHTML();
 if(!mid)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){mid.innerHTML=midHTML(to);return}
 const out=mid.animate([{transform:'translateX(0)',opacity:1,filter:'blur(0)'},{transform:'translateX(-30px)',opacity:0,filter:'blur(3px)'}],{duration:230,easing:'ease-in',fill:'forwards'});
 out.onfinish=()=>{out.cancel();mid.innerHTML=midHTML(to);
  mid.animate([{transform:'translateX(30px)',opacity:0,filter:'blur(3px)'},{transform:'translateX(0)',opacity:1,filter:'blur(0)'}],{duration:480,easing:'cubic-bezier(.2,.9,.25,1)',fill:'both'});
  const fl=mid.querySelector('.rflag');fl&&fl.animate([{transform:'scale(.35) rotate(-45deg)'},{transform:'scale(1.14) rotate(7deg)',offset:.65},{transform:'scale(1) rotate(0)'}],{duration:620,easing:'ease-out'});
  countNum(mid.querySelector('#ratenum'),from.r,to.r,800,fr)}}
function rateHTML(){shownRate=S.rate;const r=RATES[S.rate];
 return `<div class="sheen"></div>
 <div class="rmid">${midHTML(r)}</div><button class="pill" data-go="rates">${t('all')} ${ic('chev')}</button>
 <div class="dots">${dotsHTML()}</div>`}

function conv(){const c=RATES[S.sel],a=parseFloat(S.amt)||0;return a*c.r}

function home(){
 const c=RATES[S.sel],an=S.balAnim;
 return `<div class="scroll"><div class="hero pad">
  <div class="brand"><div class="logo">৳</div>${t('app')}</div>
  <div class="urow"><div class="avatar">${AV()}<i></i></div>
   <div class="uinfo"><b>${S.name||''} | ${t('personal')}</b><small>${t('acct')}: <span class="acn">${nm('123456789101')}</span><br>📍 ${t('dubai')}</small></div>
   <div style="display:flex;gap:8px">
    <button class="iconbtn" data-go="noti" aria-label="${t('noti')}">${ic('bell')}${S.unread?`<span class="badge">${nm(1)}</span>`:''}</button>
    <button class="iconbtn" data-act="logout" aria-label="${t('logout')}">${ic('out')}</button></div></div>
  <button class="bal ${an?'anim':''}" data-act="bal" aria-label="${t('seeBal')}"><span class="coin">৳</span><span class="t">${S.showBal?'':t('seeBal')}</span><span class="val ${S.showBal?'show':'hid'} ${an?'anim':''}" id="balv">${S.showBal?(an?odo(S.bal):'৳ '+fmt(S.bal)):'<i></i><i></i><i></i><i></i><i></i><i></i>'}</span>${ic(S.showBal?'eyeoff':'eye')}${S.showBal?`<span class="cd" style="animation-delay:-${((Date.now()-(S.balAt||Date.now()))/1000).toFixed(2)}s"></span>`:''}${an&&S.showBal?'<span class="veil"></span>':''}</button>
 </div>
 <div class="pad">
  <div class="offer">${ic('bellr')}<span>${t('offer')}</span></div>
  <div class="grid ${S.more?'open':''}">${['wallet','wd','phone','bill','bank','chart','gift','loan','head','chat','group','play'].map((n,i)=>`<button class="tile ${i>=8?'tmore':''}" data-tile="${i}"><span class="ic">${ic(n)}</span>${t('tiles')[i].replace(/(-| )/,'$1\n').replace('\n','<br>')}</button>`).join('')}</div>
  <button class="morebtn ${S.more?'open':''}" data-more="1" aria-expanded="${!!S.more}"><span>${S.lang==='bn'?(S.more?'বন্ধ করুন':'আরো দেখুন'):(S.more?'Close':'See more')}</span>${ic('chev')}</button>
  ${sliderHTML()}
  <div class="rate" id="rate">${rateHTML()}</div>
  <div class="card"><div class="ch"><span class="ci">${ic('calc')}</span><b>${t('calc')}</b><a data-go="rates">${t('all')} ${ic('chev')}</a></div>
   <div class="frow"><label class="f">${t('amount')}<input class="inp" id="amt" inputmode="decimal" placeholder="${nm('0.00')}" value="${esc(S.amt)}"></label>
    <label class="f">${t('country')}<select class="inp" id="cty">${RATES.map((r,i)=>`<option value="${i}" ${i===S.sel?'selected':''}>${r.f} ${cname(r)}</option>`).join('')}</select></label></div>
   <div class="res"><span id="resl">${t('inBdt')} (${t('ratePer')} ৳${rn(c.r)})</span><b id="resv">৳${fmt(conv())}</b></div>
   <div class="btns"><button class="btn p" data-act="add">${ic('plus')}${t('add')}</button><button class="btn a" data-act="send">${ic('send')}${t('send')}</button></div>
  </div></div></div>`}

function topbar(title,extra=''){return `<div class="top pad"><button class="iconbtn" data-go="home" aria-label="back">${ic('back')}</button><h1>${title}</h1>${langSw()}${extra}</div>`}
function langSw(){return `<button class="lang" data-act="lang">${ic('globe')}<span class="${S.lang==='en'?'on':''}">EN</span><span class="${S.lang==='bn'?'on':''}">বাং</span></button>`}

function history(){
 const list=S.tx.filter(x=>x.s===S.hist);
 const lab={pending:t('pending'),success:t('success'),cancel:t('cancel')};
 return topbar(t('txh'))+`<div class="scroll pad"><div class="seg">${['pending','success','cancel'].map(k=>`<button class="${S.hist===k?'on':''}" data-h="${k}">${lab[k]}</button>`).join('')}</div>
  ${list.length?`<div class="card">${list.map(x=>`<div class="tx"><div class="flag">${x.f}</div><div class="m"><b>${t('to')}: ${esc(x.name)}</b><small>${nm(x.num)} · ${nm(x.d)}</small></div><div class="a">৳${fmt(x.bdt)}<small>${nm(x.amt)} ${x.cur}</small></div></div>`).join('')}</div>`:`<div class="empty">${t('noTx').replace('{s}',lab[S.hist])}</div>`}</div>`}

function noti(){
 return topbar(t('noti'),`<button class="iconbtn" data-act="readall" aria-label="${t('markAll')}">${ic('check')}</button>`)+`<div class="scroll pad"><div class="noti ${S.unread?'unread':''}"><span class="ni">${ic('bell')}</span><div><b>${t('welcome')}${S.unread?'<i></i>':''}</b><p>${t('welcomeB')}</p><small>${nm('14/11/2026')}, ${nm('3:09:08')} PM</small></div></div></div>`}

function profile(){
 const m=[['pen','chName'],['lock','chPass'],['smile','chAv']];
 return topbar(t('prof'))+`<div class="scroll pad">
  <div class="photo"><div class="big">${AV()}</div><span class="cam">${ic('cam')}</span></div>
  <div class="card" style="margin-top:14px;padding:6px 16px">
   <div class="info"><span class="ii">${ic('user')}</span><div><small>${t('name')}</small><b>${S.name||''}</b></div></div>
   <div class="info"><span class="ii">${ic('pin')}</span><div><small>${t('cty')}</small><b>${t('dubai')}</b></div></div>
   <div class="info"><span class="ii">${ic('call')}</span><div><small>${t('supp')}</small><b>+8801856722155</b></div></div></div>
  <div class="menu">${m.map(([i,k])=>`<button class="mi" data-soon="${k}"><span class="mic">${ic(i)}</span><span>${t(k)}</span>${ic('chev').replace('<svg','<svg class="chev"')}</button>`).join('')}</div>
  <div class="menu">${[['info','about'],['play','tut']].map(([i,k])=>`<button class="mi" data-soon="${k}"><span class="mic">${ic(i)}</span><span>${t(k)}</span>${ic('chev').replace('<svg','<svg class="chev"')}</button>`).join('')}</div>
  <div class="langbox"><div class="t">${ic('globe')}${t('appLang')}</div><div class="lsw"><button class="${S.lang==='en'?'on':''}" data-setlang="en">English</button><button class="${S.lang==='bn'?'on':''}" data-setlang="bn">বাংলা</button></div></div>
  <button class="logout" data-act="logout">${ic('out')}${t('logout')}</button></div>`}

function rates(){
 return topbar(t('all'))+`<div class="scroll pad"><div class="card">${RATES.map(r=>`<div class="tx"><div class="flag">${r.f}</div><div class="m"><b>${cname(r)}</b><small>${r.cur}</small></div><div class="a">৳${rn(r.r)}<small>1 ${r.cur}</small></div></div>`).join('')}</div>
  <p style="color:var(--muted);font-size:12px;text-align:center">${S.lang==='bn'?'নমুনা রেট। আসল রেট সার্ভার থেকে আসবে।':'Sample rates. Live rates will come from your server.'}</p></div>`}

function nav(){
 const it=[['home','home','home'],['hist','clock','hist'],['noti','bell','noti'],['prof','user','prof']];
 const cur=S.tab==='rates'?'home':S.tab;
 return `<nav class="nav">${it.map(([k,i,l])=>`<button class="${cur===k?'on':''}" data-go="${k}" aria-label="${t(l)}"><span class="b">${ic(i)}${k==='noti'&&S.unread?`<span class="badge">${nm(1)}</span>`:''}</span><span>${t(l)}</span></button>`).join('')}</nav>`}

function sheet(){
 const s=S.sheet;if(!s)return '';if(s==='lb')return lbHTML();
 if(s==='add')return `<div class="scrim" data-act="closeSheet"><div class="sheet"><h2>${t('addT')}</h2><div class="sum">${t('addH')}</div><input class="inp" id="addamt" inputmode="decimal" placeholder="${nm('1000')}"><div class="btns"><button class="btn" style="background:var(--brand-soft);color:var(--brand)" data-act="closeSheet">${t('close')}</button><button class="btn p" data-act="doAdd">${t('confirm')}</button></div></div></div>`;
 const c=RATES[S.sel];
 return `<div class="scrim" data-act="closeSheet"><div class="sheet"><h2>${t('sendT')}</h2><div class="sum">${t('sendSum').replace('{a}',nm(S.amt)).replace('{c}',c.cur).replace('{b}',fmt(conv()))}</div>
  <input class="inp" id="rname" placeholder="${t('rcpt')}" autocomplete="off"><input class="inp" id="rnum" inputmode="tel" placeholder="${t('rnum')}" autocomplete="off">
  <div class="btns"><button class="btn" style="background:var(--brand-soft);color:var(--brand)" data-act="closeSheet">${t('close')}</button><button class="btn a" data-act="doSend">${t('confirm')}</button></div></div></div>`}

function render(){
 const keep=document.activeElement&&document.activeElement.id;
 const body={home,history,noti,prof:profile,hist:history,rates}[S.tab]();
 $('#app').innerHTML=body+nav()+sheet()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
 if(S.balAnim)S.balAnim=false;
 if($('#sl'))initSlider();
 document.documentElement.lang=S.lang==='bn'?'bn':'en';
 if(S.sheet){const f=$('#addamt')||$('#rname');f&&f.focus()}
 else if(keep&&$('#'+keep))$('#'+keep).focus();
}
let toastT;function toast(m){S.toast=m;clearTimeout(toastT);render();toastT=setTimeout(()=>{S.toast='';const e=$('.toast');e&&e.remove()},2200)}
function go(k){S.tab=k;S.sheet=null;if(k!=='home'){S.showBal=false;clearTimeout(balT)}if(k==='hist')S.hist='pending';render();$('.scroll')&&($('.scroll').scrollTop=0)}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-go],[data-act],[data-tile],[data-h],[data-setlang],[data-soon],[data-sl],[data-open],[data-lb]');if(!el)return;
 const d=el.dataset;
 if(d.sl){slApi&&slApi((S.sl||0)+ +d.sl)}
 else if(d.open!==undefined){if(slMoved){slMoved=false;return}S.lb=+d.open;S.sheet='lb';render()}
 else if(d.lb){S.lb=((S.lb||0)+ +d.lb+SL.length)%SL.length;render()}
 else if(d.go){go(d.go)}
 else if(d.h){S.hist=d.h;render()}
 else if(d.setlang){S.lang=d.setlang;try{localStorage.setItem('mt-lang',S.lang)}catch(_){}render()}
 else if(d.soon){toast(t('soon').replace('{x}',t(d.soon)))}
 else if(d.tile!==undefined){const i=+d.tile;if(i===0)openAdd();else toast(t('soon').replace('{x}',t('tiles')[i].replace(/\s+/g,' ')))}
 else if(d.act){
  const a=d.act;
  if(a==='slpause'){S.slPaused=!S.slPaused;render()}
  else if(a==='bal'){S.showBal=!S.showBal;S.balAnim=true;S.balFrom=0;if(S.showBal)armBal();else clearTimeout(balT);render()}
  else if(a==='lang'){S.lang=S.lang==='bn'?'en':'bn';try{localStorage.setItem('mt-lang',S.lang)}catch(_){}render()}
  else if(a==='readall'){S.unread=false;render()}
  else if(a==='logout'){toast(t('loggedOut'))}
  else if(a==='add')openAdd();
  else if(a==='send'){if(!(parseFloat(S.amt)>0)){toast(t('needAmt'));$('#amt')&&$('#amt').focus();return}S.sheet='send';render()}
  else if(a==='closeSheet'){if(el.classList.contains('scrim')&&e.target!==el)return;S.sheet=null;render()}
  else if(a==='doAdd'){const v=parseFloat($('#addamt').value);if(!(v>0))return;{const n=new Date();S.tx.unshift({s:'pending',f:'💰',cur:'BDT',amt:v,bdt:v,name:'Add Money',num:'-',d:n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear(),in:1})}S.balAnim=true;S.sheet=null;S.showBal=true;armBal();toast(S.lang==='bn'?'রিকোয়েস্ট জমা হয়েছে, অ্যাডমিন অ্যাপ্রুভ করলে ব্যালেন্স যোগ হবে':'Request submitted. Balance is added after admin approval')}
  else if(a==='doSend'){
   const name=$('#rname').value.trim(),num=$('#rnum').value.trim();
   if(!name||!num){toast(t('needRcpt'));return}
   const c=RATES[S.sel],bdt=conv();
   if(bdt>S.bal){toast(t('lowBal'));return}
   S.bal-=bdt;const n=new Date();
   S.tx.unshift({s:'pending',f:c.f,cur:c.cur,amt:S.amt,bdt,name,num,d:n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()});
   S.amt='';S.sheet=null;toast(t('sent'));
  }
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='amt'){S.amt=e.target.value.replace(/[^\d.]/g,'');if(S.amt!==e.target.value)e.target.value=S.amt;$('#resv').textContent='৳'+fmt(conv())}
});
document.addEventListener('change',e=>{
 if(e.target.id==='cty'){S.sel=+e.target.value;S.rate=S.sel;render()}
});
function openAdd(){S.sheet='add';render()}
render();startRotate();
</script>

 hf.style.strokeDasharray=C;set(0);
 const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(_){}};
 const finish=()=>{if(done)return;done=true;cancelAnimationFrame(raf);set(1);w.classList.remove('hold');w.classList.add('ok2');vib([20,40,30]);cb(reset)};
 const reset=()=>{done=false;cancelAnimationFrame(raf);w.classList.remove('ok2','hold');hf.style.transition='stroke-dashoffset .3s';set(0)};
 const loop=n=>{if(done||!t0)return;const p=Math.min(1,(n-t0)/DUR);set(p);if(p>=1)finish();else raf=requestAnimationFrame(loop)};
 const start=e=>{if(done||t0)return;if(e&&e.pointerId!==undefined){try{w.setPointerCapture(e.pointerId)}catch(_){}}hf.style.transition='none';w.classList.add('hold');t0=performance.now();vib(10);raf=requestAnimationFrame(loop)};
 const stop=()=>{if(!t0)return;t0=0;if(!done){cancelAnimationFrame(raf);w.classList.remove('hold');hf.style.transition='stroke-dashoffset .3s';set(0)}};
 w.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(ev=>w.addEventListener(ev,stop));

.snd{padding:16px 16px}
/* fit logo inside tile on small phones */
.og .oi:has(.plg) .plg{width:calc(100% - 10px)!important;max-width:72px;height:auto!important;aspect-ratio:1/1}

/* ===== Photo slider animations ===== */
.slbg.ph{transform:none!important;animation:none!important;background:#1a0a14}
.sls.on .slbg.ph{animation:none!important}
.slbg.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.18);will-change:transform;-webkit-user-drag:none;user-select:none;pointer-events:none}
.sls.on .slbg.ph img.a0{animation:kbIn 8s ease-out forwards}
.sls.on .slbg.ph img.a1{animation:kbPanR 8s ease-out forwards}
.sls.on .slbg.ph img.a2{animation:kbPanL 8s ease-out forwards}
@keyframes kbIn{from{transform:scale(1.04)}to{transform:scale(1.22)}}
@keyframes kbPanR{from{transform:scale(1.2) translateX(-4%)}to{transform:scale(1.2) translateX(4%)}}
@keyframes kbPanL{from{transform:scale(1.24) translate(3%,-2%)}to{transform:scale(1.06) translate(-2%,2%)}}
.slbg.ph::after{background:linear-gradient(90deg,rgba(20,4,14,.72),rgba(20,4,14,.25) 60%,transparent),linear-gradient(0deg,rgba(20,4,14,.45),transparent 45%);z-index:1}
.slsh{position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);opacity:0}
.sls.on .slsh{animation:slShine 1.6s .9s ease-out 1 forwards}
@keyframes slShine{0%{left:-60%;opacity:1}100%{left:140%;opacity:1}}
@media (prefers-reduced-motion:reduce){.slbg.ph img,.slsh{animation:none!important}}
.sls:has(.slbg.ph) .slx{padding-top:26px;padding-bottom:4px}

/* ===== Premium slide finish ===== */
.sls::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -30px 40px -30px rgba(0,0,0,.35)}
.sls:not(:has(.ph))::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);opacity:0}
.sls.on:not(:has(.ph))::after{animation:slShine 1.7s 1s ease-out 1 forwards}
.slx b{letter-spacing:.2px}
.slx small{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.1));border-color:rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){.sls::after{animation:none!important}}
</style>
<script>
(()=>{
// animations always on (some phones force "reduce motion" which silently disables every animation)
{const mm=window.matchMedia.bind(window);window.matchMedia=s=>/reduced-motion/.test(String(s))?{matches:false,media:String(s),onchange:null,addEventListener(){},removeEventListener(){},addListener(){},removeListener(){},dispatchEvent(){return false}}:mm(s)}
const bl=()=>S.lang==='bn',L=(b,e)=>bl()?b:e,q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
const lsg=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
const ad=()=>lsg('mt-admin',{})||{};
const D=()=>{const n=new Date();return n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()};
const stL=s=>({pending:t('pending'),success:t('success'),cancel:t('cancel')}[s]);
const SRC='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
let xtT;const xt=m=>{qa('.xt').forEach(x=>x.remove());const e=document.createElement('div');e.className='xt';e.textContent=m;document.body.appendChild(e);clearTimeout(xtT);xtT=setTimeout(()=>e.remove(),2300)};
async function copy(s){try{await navigator.clipboard.writeText(s)}catch(_){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}}
const ovE=()=>document.getElementById('ov');
function closeP(){const o=ovE(),p=o.querySelector('.op');if(!p){o.classList.remove('on');return}p.classList.add('out');setTimeout(()=>{o.classList.remove('on');o.innerHTML=''},260)}
function page(title,html,wire){const o=ovE();o.classList.add('on');o.innerHTML=`<div class="op"><div class="ot"><button class="iconbtn" data-xb aria-label="back">${ic('back')}</button><h1>${title}</h1></div><div class="ob">${html}</div></div>`;[...o.querySelector('.ob').children].forEach((c,i)=>c.style.setProperty('--i',i));o.querySelector('[data-xb]').onclick=closeP;if(wire)wire(o)}

// ---- theme
const isDark=()=>{const th=document.documentElement.dataset.theme;return th?th==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
{const th0=lsg('mt-theme','');if(th0)document.documentElement.dataset.theme=th0}

// ---- wallet persistence (balance, history, beneficiaries survive refresh), per user
let lastU,owner=null,lastN=S.tx.length,ready=false;
const wk=()=>'mt-w-'+S.user;
function saveW(){if(!S.user)return;S.tx.forEach(x=>{if(!x.id){x.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);syncTx(x)}});lss(wk(),{ben:S.ben||[],pkg:S.pkg||null,dep:(S.dep||[]).map(d=>({ref:d.ref,trx:d.trx,m:d.m,a:d.a,n:d.n})),unread:S.unread});saveProfile()}
function attach(){if(!S.user)return;const w=lsg(wk(),null);
 if(w){S.ben=w.ben||[];S.pkg=w.pkg||null;S.dep=w.dep||[];S.unread=w.unread!==false}
  else if(owner&&owner!==S.user){S.ben=[];S.pkg=null;S.dep=[];S.unread=true}
 owner=S.user;lastN=S.tx.length}

// ---- history: search + in/out filter + detail
function histRow(x){const i=S.tx.indexOf(x);return `<button class="tx px-r" data-tx="${i}"><div class="flag">${x.f}</div><div class="m"><b>${esc(x.name)}</b><small>${nm(esc(x.num))} · ${nm(x.d)}</small></div><div class="a"><b style="color:${x.in?'#1f9d55':'var(--danger)'}">${x.in?'+':'−'}৳${fmt(x.bdt)}</b>${x.cur&&x.cur!=='BDT'?`<small>${nm(x.amt)} ${esc(x.cur)}</small>`:''}</div></button>`}
function hist(){const sc=q('.scroll');if(!sc)return;const seg=sc.querySelector('.seg');if(!seg)return;
 const nx=seg.nextElementSibling;if(nx)nx.remove();
 seg.insertAdjacentHTML('afterend',`<div class="px-s">${SRC}<input id="hq" placeholder="${L('নাম, নম্বর বা পরিমাণ খুঁজুন','Search name, number or amount')}" value="${esc(S.hq||'')}" autocomplete="off"></div><div class="px-ch" id="hf">${[['all',L('সব','All')],['in',L('জমা','Credit')],['out',L('খরচ','Debit')]].map(f=>`<button data-hf="${f[0]}" class="${(S.hf||'all')===f[0]?'on':''}">${f[1]}</button>`).join('')}</div><div id="hl"></div>`);
 paintH()}
function paintH(){const box=q('#hl');if(!box)return;const v=(S.hq||'').toLowerCase().trim(),f=S.hf||'all';
 const r=S.tx.filter(x=>x.s===S.hist&&(f==='all'||(f==='in')===!!x.in)&&(!v||[x.name,x.num,x.d,x.bdt,x.cur].join(' ').toLowerCase().includes(v)));
 box.innerHTML=r.length?`<div class="card">${r.map(histRow).join('')}</div>`:`<div class="empty">${S.tx.some(x=>x.s===S.hist)?L('কিছু পাওয়া যায়নি','Nothing found'):t('noTx').replace('{s}',stL(S.hist))}</div>`}
function txPage(i){const x=S.tx[i];if(!x)return;
 const rows=[[L('ধরন','Type'),x.in?L('জমা','Credit'):L('খরচ','Debit')],[L('বিবরণ','Description'),x.name],[L('নম্বর','Number'),x.num],[L('তারিখ','Date'),x.d],[L('স্ট্যাটাস','Status'),stL(x.s)]];
 if(x.cur&&x.cur!=='BDT')rows.push([L('মূল পরিমাণ','Original amount'),x.amt+' '+x.cur]);
 page(L('লেনদেনের বিস্তারিত','Transaction details'),`<div class="oq rc"><div style="font-size:38px">${x.f}</div><div class="rcA" style="color:${x.in?'#1f9d55':'var(--danger)'}">${x.in?'+':'−'}৳${fmt(x.bdt)}</div>${rows.map(r=>`<div class="rr"><span>${r[0]}</span><b>${esc(nm(r[1]))}</b></div>`).join('')}</div><div class="og g2"><button class="ob2 gh" data-cd>📋 ${L('কপি','Copy')}</button><button class="ob2" data-cl>${L('ঠিক আছে','Done')}</button></div>`,o=>{o.querySelector('[data-cl]').onclick=closeP;o.querySelector('[data-cd]').onclick=()=>copy('Money Transfer\n'+rows.map(r=>r[0]+': '+r[1]).join('\n')+'\n৳'+x.bdt).then(()=>xt(L('কপি হয়েছে','Copied')))})}

// ---- rates: search + favourites + tap to use in calculator
function rateRows(){const fav=lsg('mt-fav',[]),v=(S.rq||'').toLowerCase().trim();
 const r=RATES.map((x,i)=>[x,i]).filter(([x])=>!v||(x.bn+' '+x.en+' '+x.cur).toLowerCase().includes(v)).sort((a,b)=>(fav.includes(b[0].k)-fav.includes(a[0].k))||(a[1]-b[1]));
 return r.length?r.map(([x,i])=>{const fv=fav.includes(x.k);return `<div class="tx px-r" data-rpick="${i}" role="button" tabindex="0"><div class="flag">${x.f}</div><div class="m"><b>${cname(x)}</b><small>${x.cur}</small></div><div class="a">৳${rn(x.r)}<small>1 ${x.cur}</small></div><button class="px-star ${fv?'on':''}" data-fav="${x.k}" aria-label="favorite">${fv?'★':'☆'}</button></div>`}).join(''):`<div class="empty">${L('কিছু পাওয়া যায়নি','Nothing found')}</div>`}
function paintR(){const b=q('#rl');if(b)b.innerHTML=rateRows()}
rates=function(){return topbar(t('all'))+`<div class="scroll pad"><div class="px-s">${SRC}<input id="rq" placeholder="${L('দেশ বা কারেন্সি খুঁজুন','Search country or currency')}" value="${esc(S.rq||'')}" autocomplete="off"></div><div class="card" id="rl">${rateRows()}</div><p style="color:var(--muted);font-size:12px;text-align:center">${L('⭐ চাপলে ফেভারিট হবে, দেশে চাপলে ক্যালকুলেটরে সেট হবে।','Tap ⭐ to favourite, tap a country to use it in the calculator.')}</p></div>`};

// ---- notifications from real activity + admin notes
noti=function(){const A=ad(),an=(A.notes||[]).filter(n=>n.t);
 const tx=S.tx.slice(0,12).map(x=>({t:x.in?(x.s==='pending'?L('অ্যাড মানি রিকোয়েস্ট জমা','Add money request submitted'):L('টাকা যোগ হয়েছে','Money added')):(x.s==='pending'?L('অনুরোধ জমা হয়েছে','Request submitted'):L('লেনদেন সফল','Transaction successful')),b:x.name+' · ৳'+fmt(x.bdt,0),d:x.d,i:'chart'}));
 const items=tx.concat(an.length?an.map(n=>({t:n.t,b:n.b,d:n.d,i:'bell'})):[{t:t('welcome'),b:t('welcomeB'),d:'',i:'bell'}]);
 return topbar(t('noti'),`<button class="iconbtn" data-act="readall" aria-label="${t('markAll')}">${ic('check')}</button>`)+`<div class="scroll pad">${items.map((n,i)=>`<div class="noti ${S.unread&&i===0?'unread':''}"><span class="ni">${ic(n.i)}</span><div><b>${esc(n.t)}${S.unread&&i===0?'<i></i>':''}</b><p>${esc(n.b||'')}</p><small>${esc(n.d?nm(n.d):'')}</small></div></div>`).join('')}</div>`};

// ---- home: recent activity + admin tile switches
const H0=home;
home=function(){let h=H0();const tl=ad().tiles||[];
 if(tl.length)h=h.replace(/<button class="tile[^"]*" data-tile="(\d+)">[\s\S]*?<\/button>/g,(m,i)=>tl[+i]&&tl[+i].on===0?'':m);
 if(!S.tx.length)return h;
 return h.replace(/<\/div><\/div>$/,`<div class="card"><div class="ch"><span class="ci">${ic('clock')}</span><b>${L('সাম্প্রতিক লেনদেন','Recent activity')}</b><a data-go="hist">${L('সব দেখুন','See all')} ${ic('chev')}</a></div>${S.tx.slice(0,3).map(histRow).join('')}</div></div></div>`)};

// ---- send sheet: pick saved beneficiary
const S0=sheet;
sheet=function(){let h=S0();if(S.sheet==='send'&&(S.ben||[]).length){const c=`<div class="px-ch">${S.ben.map((b,i)=>`<button data-bp="${i}">👤 ${esc(b.name)}</button>`).join('')}</div>`;h=h.replace('<input class="inp" id="rname"',c+'<input class="inp" id="rname"')}return h};

// ---- profile: insights + refer + promo + dark mode
function insights(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});
 const key=d=>d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
 const sum=(d,inn)=>S.tx.filter(x=>x.d===key(d)&&!!x.in===inn&&x.s!=='cancel').reduce((a,x)=>a+(+x.bdt||0),0);
 const A=days.map(d=>sum(d,true)),B=days.map(d=>sum(d,false)),mx=Math.max(1,...A,...B),h=v=>v?Math.max(6,v/mx*100):2;
 return `<div class="px-c"><div class="ch" style="margin-bottom:0"><span class="ci">${ic('chart')}</span><b>${L('গত ৭ দিনের হিসাব','Last 7 days')}</b></div><div class="px-t"><span>⬇ ${L('জমা','In')} <b style="color:#1f9d55">৳${fmt(A.reduce((a,b)=>a+b,0),0)}</b></span><span>⬆ ${L('খরচ','Out')} <b style="color:var(--danger)">৳${fmt(B.reduce((a,b)=>a+b,0),0)}</b></span></div><div class="px-b">${days.map((d,i)=>`<div><span class="bars"><i style="height:${h(A[i])}%;background:#1f9d55"></i><i style="height:${h(B[i])}%;background:var(--danger)"></i></span><small>${d.toLocaleDateString(bl()?'bn-BD':'en-GB',{weekday:'short'})}</small></div>`).join('')}</div></div>`}
const P0=profile;
profile=function(){let h=P0();
 const mi=(i,k,l,r)=>`<button class="mi" data-x="${k}"><span class="mic">${ic(i)}</span><span>${l}</span>${r||ic('chev').replace('<svg','<svg class="chev"')}</button>`;
 const x=insights()+`<div class="menu">${mi('gift','refer',L('রেফার করুন ও আয় করুন','Refer & Earn'))}${mi('bill','promo',L('প্রোমো কোড','Promo code'))}${mi('cog','theme',L('ডার্ক মোড','Dark mode'),`<span class="sw ${isDark()?'on':''}"></span>`)}</div>`;
 return h.replace('<div class="langbox">',x+'<div class="langbox">')};

function refCode(){const u=(S.user||'user').toLowerCase();let h=0;for(const c of u)h=(h*31+c.charCodeAt(0))%9973;return (u.replace(/[^a-z0-9]/g,'').slice(0,4)||'MT').toUpperCase()+String(h).padStart(4,'0')}
function referP(){const A=ad(),s=A.set||{},bonus=s.ref!=null?+s.ref:50,lv=Array.isArray(A.levels)&&A.levels.length?A.levels:[{lv:1,p:5},{lv:2,p:2},{lv:3,p:1}],code=refCode(),msg=L('Money Transfer অ্যাপে যোগ দিন! আমার রেফার কোড ব্যবহার করুন: '+code,'Join Money Transfer! Use my referral code: '+code);
 page(L('রেফার করুন ও আয় করুন','Refer & Earn'),`<div class="mh"><small>${L('আপনার রেফার কোড','Your referral code')}</small><b style="letter-spacing:3px">${code}</b><span class="mt">🎁 ${L('প্রতি বন্ধুর জন্য ৳'+fmt(bonus,0),'৳'+fmt(bonus,0)+' per friend')}</span></div><div class="og g2"><button class="ob2" data-rc>📋 ${L('কোড কপি করুন','Copy code')}</button><button class="ob2 alt" data-rs>📤 ${L('শেয়ার করুন','Share')}</button></div><div class="oq"><b>${L('কীভাবে কাজ করে','How it works')}</b>${[['1️⃣',L('বন্ধুকে আপনার কোড পাঠান','Send your code to a friend')],['2️⃣',L('সে কোড দিয়ে রেজিস্ট্রেশন করবে','They sign up with your code')],['3️⃣',L('আপনি রেফারেল বোনাস পাবেন','You get the referral bonus')]].map(r=>`<div class="ol"><span class="em">${r[0]}</span><div><b>${r[1]}</b></div></div>`).join('')}</div><div class="oq"><b>${L('মাল্টি-লেভেল কমিশন','Multi-level commission')}</b>${lv.map(l=>`<div class="rr"><span>${L('লেভেল ','Level ')}${nm(l.lv)}</span><b>${nm(l.p)}%</b></div>`).join('')}</div>`,o=>{
  o.querySelector('[data-rc]').onclick=()=>copy(code).then(()=>xt(L('কোড কপি হয়েছে','Code copied')));
  o.querySelector('[data-rs]').onclick=()=>{if(navigator.share)navigator.share({text:msg}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}})}
function promoP(){const key='mt-promo-'+S.user,used=()=>lsg(key,[]);
 const codes=()=>{const A=ad();return Array.isArray(A.coupons)?A.coupons:[{code:'WELCOME50',ty:'flat',v:50,on:1}]};
 page(L('প্রোমো কোড','Promo code'),`<div class="tu"><div class="te">🎟️</div><h2>${L('প্রোমো কোড লিখুন','Enter promo code')}</h2><p>${L('কোড দিলে বোনাস ব্যালেন্সে যোগ হবে','The bonus is added to your balance')}</p></div><div class="oq"><input class="oin" id="pc" autocapitalize="characters" autocomplete="off" placeholder="WELCOME50" style="text-transform:uppercase"><button class="ob2" data-ap>${L('প্রয়োগ করুন','Apply')}</button></div><div class="oq" id="pu"></div>`,o=>{
  const paint=()=>{o.querySelector('#pu').innerHTML=`<b>${L('ব্যবহৃত কোড','Used codes')}</b>`+(used().length?used().map(c=>`<div class="ol"><span class="em">✅</span><div><b>${esc(c)}</b></div></div>`).join(''):`<p class="sm">${L('এখনো কোনো কোড ব্যবহার হয়নি','No codes used yet')}</p>`)};paint();
  o.querySelector('[data-ap]').onclick=()=>{const v=o.querySelector('#pc').value.trim().toUpperCase();
   if(!v)return xt(L('কোড লিখুন','Enter a code'));
   const c=codes().find(x=>x.on!==0&&String(x.code).toUpperCase()===v);
   if(!c)return xt(L('কোড সঠিক নয়','Invalid code'));
   if(c.exp&&Date.parse(c.exp)<Date.now())return xt(L('কোডের মেয়াদ শেষ','Code expired'));
   if(used().includes(v))return xt(L('এই কোড আগেই ব্যবহার করা হয়েছে','Code already used'));
   const cr=S.tx.filter(x=>x.in&&x.s==='success').reduce((a,x)=>a+(+x.bdt||0),0);
   const amt=c.ty==='percent'?Math.min(1000,Math.round(cr*(+c.v||0))/100):(+c.v||0);
   if(!(amt>0))return xt(L('এই কোডটি এখন প্রযোজ্য নয়','Code not applicable yet'));
   S.bal+=amt;S.tx.unshift({s:'success',f:'🎟️',cur:'BDT',amt,bdt:amt,name:'Promo '+v,num:'-',d:D(),in:1});
   lss(key,used().concat(v));render();paint();o.querySelector('#pc').value='';xt(L('৳'+fmt(amt,0)+' বোনাস যোগ হয়েছে','৳'+fmt(amt,0)+' bonus added'))}})}
const X={refer:referP,promo:promoP,theme:()=>{const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;lss('mt-theme',n);render()}};

// ---- events
document.addEventListener('input',e=>{if(e.target.id==='hq'){S.hq=e.target.value;paintH()}else if(e.target.id==='rq'){S.rq=e.target.value;paintR()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-hf],[data-tx],[data-x],[data-fav],[data-rpick],[data-bp]');if(!b)return;const d=b.dataset;
 if(d.hf){S.hf=d.hf;qa('#hf button').forEach(x=>x.classList.toggle('on',x===b));paintH()}
 else if(d.tx!==undefined)txPage(+d.tx);
