name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user
            src: index.html
            appId: com.tamim.moneytransfer
            appName: Money Transfer
          - name: admin
            src: admin.html
            appId: com.tamim.moneytransfer.admin
            appName: MT Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp "${{ matrix.src }}" www/index.html
          cp sw.js www/sw.js
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -d icons ]; then cp -r icons www/; fi

      - name: Capacitor config
        run: |
          cat > capacitor.config.json <<JSON
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "webDir": "www"
          }
          JSON

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
