/* ---------- অ্যাপ (Capacitor): অ্যাপ বন্ধ থাকলেও পুশ নোটিফিকেশন ---------- */
const isNative=()=>{try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}catch(_){return false}};
let pushTok=null,pushSaved='';
async function nativePush(){
 if(!isNative())return;
 const PN=window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;if(!PN)return;
 try{
  await nativeChannels();
  let p=await PN.checkPermissions();if(p.receive!=='granted')p=await PN.requestPermissions();
  if(p.receive!=='granted')return;
  PN.addListener('registration',t=>{pushTok=t.value;saveTok()});
  PN.addListener('pushNotificationActionPerformed',()=>{try{kick()}catch(_){}});
  await PN.register();
  setInterval(saveTok,4000);
 }catch(_){}}
const CH_CATS=[['orders','নতুন অর্ডার'],['chat','চ্যাট মেসেজ'],['ok','সফল'],['no','বাতিল']];
async function nativeChannels(){
 if(!isNative())return;const PN=window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;if(!PN)return;
 const id=packId(),prev=LS('mtn-chpack');
 try{
  if(prev&&prev!==id)for(const [c] of CH_CATS){try{await PN.deleteChannel({id:c+'_'+prev})}catch(_){}}
  for(const [c,n] of CH_CATS)await PN.createChannel({id:c+'_'+id,name:n,importance:5,sound:'tone_'+id+'_'+c+'.wav',vibration:true,visibility:1});
  LS('mtn-chpack',id)}catch(_){}}
async function saveTok(){
 const s=SB();if(!s||!pushTok)return;
 const St=SS(),uid=ROLE==='admin'?null:(St&&St.uid);
 if(ROLE!=='admin'&&!uid)return;
 const k=pushTok+'|'+uid+'|'+packId();if(k===pushSaved)return;
 const r=await s.from('mt_push_tokens').upsert({token:pushTok,user_id:uid,role:ROLE==='admin'?'admin':'user',tone:packId(),updated_at:new Date().toISOString()});
 if(!r.error)pushSaved=k}

/* ---------- চালু করা ---------- */
window.MTN={play,notify,toast,liveChat,tick,askPerm};
// লগইন স্ক্রিনে চ্যাট ও টোন বাটন লুকানো থাকবে, লগইনের পর দেখাবে
function vis(){
 let on;
 if(ROLE==='admin')on=!document.getElementById('al');
 else{const St=SS();on=!!(St&&St.uid)}
 ['mtn-cb','mtn-snd'].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display=on?'':'none'});
 if(!on&&AP.open)AP.close()}
function boot(){
 sndBtn();setInterval(vis,400);if(ROLE==='admin')AP.init();
 tick();setInterval(()=>{tick()},document.hidden?8000:3000);
 setInterval(()=>{if(document.hidden)tick()},8000);
 addEventListener('online',tick);
 if(ROLE==='admin')ensureRt('admin');
 try{if(('serviceWorker' in navigator)&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
 if(!isNative())permBanner();
 nativePush();
 // সাইটের যেকোনো জায়গায় প্রথম ট্যাপেই ব্রাউজারের অনুমতি চাইবে
 const once=()=>{removeEventListener('click',once,true);removeEventListener('touchend',once,true);if('Notification' in window&&Notification.permission==='default')askPerm()};
 if(!isNative()){addEventListener('click',once,true);addEventListener('touchend',once,true)}}
function permBanner(){
 try{
  if(!('Notification' in window)){return}
  const p=Notification.permission;
  if(p==='default')setTimeout(()=>toast({t:'নোটিফিকেশন চালু করুন',b:'নতুন '+(ROLE==='admin'?'অর্ডার ও মেসেজ':'আপডেট ও মেসেজ')+' সাথে সাথে পেতে এখানে চাপুন, তারপর "Allow" দিন',kind:'bell',ms:15000,go:askPerm}),1200);
  else if(p==='denied'&&Date.now()-(+LS('mtn-dn')||0)>864e5){LS('mtn-dn',String(Date.now()));setTimeout(()=>toast({t:'নোটিফিকেশন বন্ধ আছে',b:'ব্রাউজারের ঠিকানার বারে 🔒 বা ⋮ → Site settings → Notifications → Allow করুন',kind:'no',ms:12000}),1500)}
 }catch(_){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
